name: callReminder

options:
  bundleIdPrefix: com.konayre
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc подпись ломает TCC-грант календаря на каждой пересборке (cdhash
    # меняется -> designated requirement не сходится). Только стабильная identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: C3F9103E047C3BE5D2073859694934BAFFDC580A
    DEVELOPMENT_TEAM: JL7A6FPBTW   # OU сертификата, а не то, что в скобках в CN

targets:
  callReminder:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konayre.callreminder
        PRODUCT_NAME: callReminder
        ENABLE_APP_SANDBOX: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: callReminder
        CFBundleDisplayName: callReminder
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSCalendarsFullAccessUsageDescription: >-
          callReminder читает календарь, чтобы показывать ближайшую встречу
          в меню-баре и предупреждать до её начала.
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ENABLE_USER_SCRIPT_SANDBOXING" = "YES" ]; then
            echo "warning: SwiftLint skipped (user script sandboxing is on)"; exit 0
          fi
          SWIFTLINT="$(command -v swiftlint || echo /opt/homebrew/bin/swiftlint)"
          if [ ! -x "$SWIFTLINT" ]; then
            echo "warning: SwiftLint not installed — brew install swiftlint"; exit 0
          fi
          "$SWIFTLINT" lint --quiet --config "$SRCROOT/.swiftlint.yml" "$SRCROOT/Sources"

  callReminderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: callReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konayre.callreminder.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/callReminder.app/Contents/MacOS/callReminder"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  callReminder:
    build:
      targets:
        callReminder: all
        callReminderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - callReminderTests
    archive:
      config: Release
