name: callReminder

options:
  bundleIdPrefix: com.konayre
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # База английская, русский — перевод в Localizable.xcstrings. knownRegions
  # задавать не нужно: xcodegen выводит их из содержимого каталога — проверено.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # По умолчанию ad-hoc, чтобы проект собирался у любого без настройки.
    # Своя identity задаётся в signing.local (см. README): ad-hoc меняет cdhash
    # при каждой сборке, из-за чего macOS заново спрашивает доступ к Календарю.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  callReminder:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konayre.callreminder
        PRODUCT_NAME: Call Reminder
        # Модуль остаётся callReminder: иначе @testable import поедет
        # вслед за отображаемым именем и станет Call_Reminder.
        PRODUCT_MODULE_NAME: callReminder
        # Sandbox обязателен для Mac App Store (гайдлайн 2.4.5(i)). Права —
        # в Sources/callReminder.entitlements, там же объяснено, каких нет и почему.
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sources/callReminder.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Call Reminder
        CFBundleDisplayName: Call Reminder
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        # Шифрования нет вовсе, поэтому App Store Connect не будет спрашивать
        # про экспортный контроль при каждой загрузке сборки.
        ITSAppUsesNonExemptEncryption: false
        # Английский — база; русский перевод лежит в Sources/InfoPlist.xcstrings.
        NSCalendarsFullAccessUsageDescription: >-
          Call Reminder reads your calendar to show the next meeting in the
          menu bar and warn you before it starts.
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ENABLE_USER_SCRIPT_SANDBOXING" = "YES" ]; then
            echo "warning: SwiftLint skipped (user script sandboxing is on)"; exit 0
          fi
          SWIFTLINT="$(command -v swiftlint || echo /opt/homebrew/bin/swiftlint)"
          if [ ! -x "$SWIFTLINT" ]; then
            echo "warning: SwiftLint not installed — brew install swiftlint"; exit 0
          fi
          "$SWIFTLINT" lint --quiet --config "$SRCROOT/.swiftlint.yml" "$SRCROOT/Sources"

  callReminderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: callReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konayre.callreminder.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Call Reminder.app/Contents/MacOS/Call Reminder"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  callReminder:
    build:
      targets:
        callReminder: all
        callReminderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Тесты прибиты к русскому, иначе сьют читал бы системный язык машины и
      # ассерты вроде «1 ч 30 мин» падали бы на английской macOS. Заодно это
      # гейт полноты перевода: пропал ключ в каталоге — вернётся английский
      # и тест упадёт. Форс проверен эмпирически: locale: у String(localized:)
      # переключает только форматирование чисел, но НЕ язык перевода.
      commandLineArguments:
        "-AppleLanguages (ru)": true
      targets:
        - callReminderTests
    archive:
      config: Release
